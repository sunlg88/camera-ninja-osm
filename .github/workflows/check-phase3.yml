name: Check Phase 3 Camera Matching

on:
  push:
    branches: [phase3-camera-matching]
    paths:
      - 'scripts/match_cameras.py'
      - 'scripts/fetch_public_cameras.py'
      - '.github/workflows/build-camera-db.yml'
      - 'docs/phase3-camera-matching.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile Python scripts
        run: |
          python3 -m py_compile scripts/match_cameras.py scripts/fetch_public_cameras.py
      - name: Smoke-test camera matcher CLI
        run: |
          python3 scripts/match_cameras.py --help >/dev/null
          python3 scripts/fetch_public_cameras.py --help >/dev/null

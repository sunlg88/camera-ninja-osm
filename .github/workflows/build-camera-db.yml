name: Build Korea Camera Ninja Camera DB

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://download.geofabrik.de/asia/south-korea-latest.osm.pbf

jobs:
  build-camera-db:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool sqlite3 zstd
          python3 -m pip install --disable-pip-version-check osmium

      - name: Download latest South Korea OSM
        run: |
          mkdir -p work dist
          curl -fL --retry 3 --retry-delay 5 "$SOURCE_URL" -o work/south-korea-latest.osm.pbf

      - name: Extract all highway ways
        run: |
          osmium tags-filter \
            --overwrite \
            -o work/south-korea-roads.osm.pbf \
            work/south-korea-latest.osm.pbf \
            w/highway
          osmium check-refs work/south-korea-roads.osm.pbf

      - name: Build compact road graph
        run: |
          python3 scripts/build_compact_graph.py \
            work/south-korea-roads.osm.pbf \
            config/vehicle_access.json \
            work/camera-ninja-korea-roads-compact.db \
            | tee dist/compact-build.json

      - name: Fetch nationwide public camera data
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 scripts/fetch_public_cameras.py work/cameras.json

      - name: Match cameras to OSM road segments
        run: |
          python3 scripts/match_cameras_unique.py \
            work/camera-ninja-korea-roads-compact.db \
            work/cameras.json \
            dist/camera-ninja-korea-cameras.db \
            --report dist/camera-match-report.json

      - name: Derive conservative travel-direction metadata
        run: |
          python3 scripts/derive_camera_direction.py \
            dist/camera-ninja-korea-cameras.db \
            --report dist/camera-direction-report.json

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json, sqlite3
          db='dist/camera-ninja-korea-cameras.db'
          c=sqlite3.connect(db)
          assert c.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          total=c.execute('select count(*) from cameras').fetchone()[0]
          matched=c.execute('select count(*) from cameras where segment_id is not null').fetchone()[0]
          speed=c.execute("select count(*) from cameras where alert_default=1").fetchone()[0]
          direction_populated=c.execute('select count(*) from cameras where direction_mode is not null').fetchone()[0]
          hard_direction=c.execute('select count(*) from cameras where direction_hard_filter=1').fetchone()[0]
          assert total > 40000, total
          assert matched / total > 0.98, (matched,total)
          assert direction_populated == total, (direction_populated,total)
          print(json.dumps({
            'total':total,
            'matched':matched,
            'defaultSpeedAlerts':speed,
            'directionRows':direction_populated,
            'hardDirectionRows':hard_direction,
          }, ensure_ascii=False))
          PY

      - name: Compress camera DB
        run: |
          zstd -19 -T0 dist/camera-ninja-korea-cameras.db -o dist/camera-ninja-korea-cameras.db.zst
          sha256sum dist/camera-ninja-korea-cameras.db.zst > dist/CAMERA_SHA256SUMS
          ls -lh dist/

      - name: Upload camera DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-ninja-korea-camera-db
          path: |
            dist/camera-ninja-korea-cameras.db.zst
            dist/camera-match-report.json
            dist/camera-direction-report.json
            dist/CAMERA_SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

name: Build Korea Camera Ninja Compact Road Graph

on:
  workflow_dispatch:
  push:
    branches: [phase2-road-graph]
    paths:
      - '.github/workflows/build-road-graph.yml'
      - 'scripts/build_compact_graph.py'
      - 'scripts/validate_compact_graph.py'
      - 'config/vehicle_access.json'

permissions:
  contents: read

env:
  SOURCE_URL: https://download.geofabrik.de/asia/south-korea-latest.osm.pbf

jobs:
  build-compact-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool sqlite3 zstd
          python3 -m pip install --disable-pip-version-check osmium

      - name: Download latest South Korea OSM
        run: |
          mkdir -p work dist
          curl -fL --retry 3 --retry-delay 5 "$SOURCE_URL" -o work/south-korea-latest.osm.pbf

      - name: Extract all highway ways
        run: |
          osmium tags-filter \
            --overwrite \
            -o work/south-korea-roads.osm.pbf \
            work/south-korea-latest.osm.pbf \
            w/highway
          osmium check-refs work/south-korea-roads.osm.pbf
          ls -lh work/south-korea-roads.osm.pbf

      - name: Build compact Camera Ninja road graph
        run: |
          python3 scripts/build_compact_graph.py \
            work/south-korea-roads.osm.pbf \
            config/vehicle_access.json \
            dist/camera-ninja-korea-roads-compact.db \
            | tee dist/compact-build.json

      - name: Validate compact SQLite graph and R-tree
        run: |
          python3 scripts/validate_compact_graph.py \
            dist/camera-ninja-korea-roads-compact.db \
            | tee dist/compact-validation.json

      - name: Compress compact graph DB
        run: |
          zstd -19 -T0 \
            dist/camera-ninja-korea-roads-compact.db \
            -o dist/camera-ninja-korea-roads-compact.db.zst
          sha256sum \
            dist/camera-ninja-korea-roads-compact.db \
            dist/camera-ninja-korea-roads-compact.db.zst \
            > dist/SHA256SUMS
          ls -lh dist/

      - name: Upload compact graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: camera-ninja-korea-compact-road-graph
          path: |
            dist/camera-ninja-korea-roads-compact.db.zst
            dist/compact-build.json
            dist/compact-validation.json
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

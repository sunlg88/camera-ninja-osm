name: Verify data.go.kr Camera API Secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-data-go-secret.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify nationwide camera API secret
        env:
          RAW_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          raw = os.environ.get('RAW_SERVICE_KEY', '').strip()
          if not raw:
              raise SystemExit('DATA_GO_KR_SERVICE_KEY secret is missing or empty')

          # The current data.go.kr UI may show one URL-encoded key. Normalize it
          # exactly once, while preserving literal + characters in decoded keys.
          key = urllib.parse.unquote(raw)
          url = 'https://api.data.go.kr/openapi/tn_pubr_public_unmanned_traffic_camera_api'
          query = urllib.parse.urlencode({
              'serviceKey': key,
              'pageNo': 1,
              'numOfRows': 1,
              'type': 'json',
          })
          req = urllib.request.Request(url + '?' + query, headers={'User-Agent': 'Camera-Ninja-CI/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          wrapped = payload.get('response', payload)
          header = wrapped.get('header', {})
          code = str(header.get('resultCode', '00'))
          msg = str(header.get('resultMsg', ''))
          if code not in {'00', '0', 'NORMAL_CODE'}:
              raise SystemExit(f'data.go.kr API rejected secret: code={code}, msg={msg}')

          body = wrapped.get('body', wrapped)
          total = int(body.get('totalCount', 0) or 0)
          if total < 40000:
              raise SystemExit(f'API responded but nationwide record count looks too small: {total}')

          print(json.dumps({
              'secretConfigured': True,
              'apiResultCode': code,
              'totalCount': total,
              'status': 'PASS'
          }, ensure_ascii=False))
          PY
